name: Update publications from Google Scholar

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    paths:
      - "data/**"
      - "scripts/**"
      - "index.html"

permissions:
  contents: write

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Google Scholar and render site
        env:
          # Optional: add a SERPAPI_KEY repository secret if Google Scholar blocks the runner.
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/update_site.py --fetch

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data index.html
          git commit -m "Update publications from Google Scholar"
          git push
