name: Email visit report every 10 visits

on:
  schedule:
    - cron: "*/30 * * * *" # check every 30 minutes
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: visit-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check visits and send the report
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 scripts/visit_report.py

      - name: Save how many visits were reported
        run: |
          if git status --porcelain .github/analytics-state.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add .github/analytics-state.json
            git commit -m "Update visit report state"
            git pull --rebase --quiet
            git push
          fi
